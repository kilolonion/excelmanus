name: Android client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'web/server/**'
      - 'web/src/components/sidebar/MobilePairingDialog.tsx'
      - 'web/src/lib/mobile-pairing.ts'
      - 'web/src/lib/save-blob.ts'
      - 'web/src/types/global.d.ts'
      - 'web/src/components/settings/model/CodexOAuthCard.tsx'
      - '.github/workflows/android-build.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check bridge and LAN gateway
        run: node --test android/tests/bridge.test.cjs android/tests/lan-gateway.test.mjs android/tests/mobile-pairing.test.cjs
      - name: Build and check Android client
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload preview APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: excelmanus-android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
