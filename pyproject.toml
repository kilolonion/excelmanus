[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excelmanus"
version = "1.8.1"
description = "基于大语言模型的 Excel 智能代理框架，支持 Web UI / REST API 运行"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "xlrd>=2.0.0",
    "pyxlsb>=1.0.10",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "mcp>=1.0.0",
    "jsonschema>=4.26.0",
    "referencing>=0.30.0",
    "matplotlib>=3.7.0",
    "xlsxwriter>=3.1.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "playwright>=1.56,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<1",
    # [tool.pytest.ini_options] 配置了 timeout=60，必须声明该插件，否则 pytest 直接报错退出。
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.400",
]
vba = [
    "oletools>=0.60.0",
]
analysis = [
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
]
all = [
    "excelmanus[web]",
    "excelmanus[analysis]",
]
system-one = [
    "typesafe-sdk",
]

[project.scripts]
excelmanus-api = "excelmanus.api:main"

[dependency-groups]
# The frozen backend owns API/model/MCP dependencies. The separate interpreter
# only carries the libraries used by the desktop spreadsheet/document runtime
# and its built-in plotting skill. Optional scientific-analysis extras remain
# available to source deployments through the `analysis` extra.
desktop-runtime = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "xlrd>=2.0.0",
    "pyxlsb>=1.0.10",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "xlsxwriter>=3.1.0",
    "Pillow>=10.0.0",
    "oletools>=0.60.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.setuptools.packages.find]
include = ["excelmanus*"]

[tool.setuptools.package-data]
excelmanus = [
    "model_catalog.json",
    "prompts/**/*.md",
    "skillpacks/**/*",
    "knowledge/topics/*.md",
    "workbook/render_assets/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "**/.DS_Store"]
